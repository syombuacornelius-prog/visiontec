<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visiontec - Customers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --primary-light: #6366f1;
    --secondary: #f59e0b;
    --secondary-dark: #d97706;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
    --success: #10b981;
    --background: #f8fafc;
    --surface: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
    box-shadow: var(--shadow-lg);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-content {
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    font-size: 1.5rem;
    font-weight: 800;
    color: white;
    letter-spacing: -0.5px;
    text-decoration: none;
  }

  .brand span {
    font-size: 0.75rem;
    font-weight: 400;
    color: #a5b4fc;
    display: block;
    margin-top: 0.25rem;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: white;
    font-size: 0.875rem;
  }

  .logout-btn {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-size: 0.875rem;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  nav {
    background: rgba(79, 70, 229, 0.5);
    backdrop-filter: blur(10px);
    overflow-x: auto;
    scrollbar-width: thin;
  }

  nav::-webkit-scrollbar {
    height: 4px;
  }

  nav::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
  }

  .nav-link {
    display: inline-block;
    padding: 0.75rem 1rem;
    color: #a5b4fc;
    font-size: 0.8125rem;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }

  .nav-link:hover {
    color: white;
    background: rgba(255, 255, 255, 0.1);
    border-bottom-color: white;
  }

  .nav-link.active {
    color: white;
    background: rgba(255, 255, 255, 0.2);
    border-bottom-color: white;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  .page-header {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .page-header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .page-title {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .page-title h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .page-title i {
    color: var(--secondary);
    font-size: 1.5rem;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.75rem;
    border: none;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: var(--shadow);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }

  .search-box {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.75rem;
    font-size: 0.875rem;
    transition: all 0.2s;
    background: var(--surface);
  }

  .search-box:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
  }

  .customers-list {
    display: grid;
    gap: 1rem;
  }

  .customer-card {
    background: var(--surface);
    border-radius: 1rem;
    padding: 1.5rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .customer-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: var(--secondary);
  }

  .customer-info {
    flex: 1;
  }

  .customer-name {
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .customer-contact {
    display: flex;
    gap: 1.5rem;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.875rem;
    color: var(--text-muted);
  }

  .contact-item i {
    color: var(--secondary);
    font-size: 1rem;
  }

  .contact-item a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .contact-item a:hover {
    color: var(--secondary);
  }

  .customer-actions {
    display: flex;
    gap: 0.5rem;
  }

  .btn-sm {
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
  }

  .btn-outline {
    background: var(--background);
    color: var(--text-muted);
    border: 2px solid var(--border);
  }

  .btn-outline:hover {
    background: var(--text-muted);
    color: white;
  }

  .btn-danger {
    background: var(--danger);
    color: white;
  }

  .btn-danger:hover {
    background: var(--danger-dark);
  }

  .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
    background: var(--surface);
    border-radius: 1rem;
    box-shadow: var(--shadow);
  }

  .empty-state i {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.5;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal-content {
    background: var(--surface);
    border-radius: 1.5rem;
    max-width: 450px;
    width: 100%;
    padding: 2rem;
    box-shadow: var(--shadow-lg);
  }

  .modal-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 1.5rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  .form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.75rem;
    font-size: 0.875rem;
    transition: all 0.2s;
    background: var(--background);
  }

  .form-input:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
  }

  .modal-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
  }

  .btn-submit {
    flex: 1;
    background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.75rem;
    border: none;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel {
    flex: 1;
    background: var(--background);
    color: var(--text-muted);
    padding: 0.75rem 1.5rem;
    border-radius: 0.75rem;
    border: 2px solid var(--border);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover {
    background: var(--text-muted);
    color: white;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 768px) {
    .page-header-content {
      flex-direction: column;
      gap: 1rem;
    }
    
    .btn-primary {
      width: 100%;
      justify-content: center;
    }
    
    .customer-card {
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
    }
    
    .customer-actions {
      width: 100%;
      justify-content: flex-end;
    }
  }
</style>
</head>
<body>
<header>
  <div class="header-content">
    <a href="./home.html" class="brand">
      VISIONTEC
      <span>Computer Shop System</span>
    </a>
    <div class="user-info">
      <span id="active-worker-name">Not Logged In</span>
      <button id="logout-btn" class="logout-btn hidden">Logout</button>
    </div>
  </div>
  <nav>
    <a class="nav-link" href="./home.html">Home</a>
    <a class="nav-link" href="./login.html">Login</a>
    <a class="nav-link" href="./dashboard.html">Dashboard</a>
    <a class="nav-link" href="./products.html">Products</a>
    <a class="nav-link active" href="./customers.html">Customers</a>
    <a class="nav-link" href="./sales.html">Sales / POS</a>
    <a class="nav-link" href="./suppliers.html">Suppliers</a>
    <a class="nav-link admin-only-link" href="./expenses.html">Expenses</a>
    <a class="nav-link admin-only-link" href="./reports.html">Reports</a>
    <a class="nav-link admin-only-link" href="./team.html">Team Members</a>
    <a class="nav-link" href="./receipt.html">Receipt</a>
  </nav>
</header>

<main>
  <div class="page-header">
    <div class="page-header-content">
      <div class="page-title">
        <h2>
          <i class="fa-solid fa-users"></i>
          Customer Directory
        </h2>
      </div>
      <button onclick="openCustomerModal()" class="btn-primary">
        <i class="fa-solid fa-user-plus"></i>
        Add New Customer
      </button>
    </div>
  </div>

  <input type="text" id="customer-search" oninput="renderCustomers()" placeholder="Search customer name or phone number..." class="search-box">

  <div id="customers-list" class="customers-list">
    <div class="empty-state">
      <i class="fa-solid fa-users"></i>
      <h3>No Customers Added</h3>
      <p>Click "Add New Customer" to create a customer record.</p>
    </div>
  </div>
</main>

<div id="customer-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 class="modal-title">Add New Customer</h3>
    <form onsubmit="saveCustomer(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="cust-name" class="form-input" required placeholder="Enter customer name">
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" id="cust-phone" class="form-input" required placeholder="Enter phone number">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="cust-email" class="form-input" placeholder="Enter email address">
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeCustomerModal()" class="btn-cancel">Cancel</button>
        <button type="submit" class="btn-submit">Save Customer</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Authentication and role-based access control
  (function() {
    const session = sessionStorage.getItem('user_session');
    
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const user = JSON.parse(session);
      
      const userNameElement = document.getElementById('active-worker-name');
      if (userNameElement) {
        userNameElement.textContent = user.username;
      }
      
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.classList.remove('hidden');
        logoutBtn.onclick = () => {
          sessionStorage.removeItem('user_session');
          window.location.href = 'home.html';
        };
      }

      const isAdmin = (user.is_admin === true) || (user.role === 'admin');
      
      if (!isAdmin) {
        const adminLinks = document.querySelectorAll('.admin-only-link');
        adminLinks.forEach(function(link) {
          link.style.display = 'none';
          link.parentElement.removeChild(link);
        });
        console.log('Non-admin user detected. Admin links removed.');
      } else {
        console.log('Admin user detected. All links visible.');
      }
    } catch (e) {
      console.error('Error:', e);
      window.location.href = 'login.html';
    }
  })();

  // Customer management functions
  let customers = [];

  // Load customers from database on page load
  async function loadCustomers() {
    try {
      const response = await fetch('/api/bootstrap');
      if (!response.ok) throw new Error('Database API unavailable');
      const result = await response.json();
      
      if (!result.empty && result.data && Array.isArray(result.data.customers)) {
        customers = result.data.customers;
      }
      
      renderCustomers();
    } catch (error) {
      console.error('Error loading customers:', error);
      showToast('Failed to load customer data from database.');
    }
  }

  function openCustomerModal() {
    document.getElementById('customer-modal').classList.remove('hidden');
    // Clear form
    document.getElementById('cust-name').value = '';
    document.getElementById('cust-phone').value = '';
    document.getElementById('cust-email').value = '';
  }

  function closeCustomerModal() {
    document.getElementById('customer-modal').classList.add('hidden');
  }

  async function saveCustomer(event) {
    event.preventDefault();
    
    const name = document.getElementById('cust-name').value;
    const phone = document.getElementById('cust-phone').value;
    const email = document.getElementById('cust-email').value;
    
    try {
      // Add to local array
      const newCustomer = {
        id: `cust-${Date.now()}`,
        name,
        phone,
        email: email || ''
      };
      
      customers.push(newCustomer);
      
      // Save to database
      await saveToDatabase();
      
      closeCustomerModal();
      renderCustomers();
      showToast('Customer saved successfully!');
    } catch (error) {
      console.error('Error saving customer:', error);
      showToast('Failed to save customer to database.');
    }
  }

  async function saveToDatabase() {
    try {
      const response = await fetch('/api/sync', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { customers } })
      });
      
      if (!response.ok) throw new Error('Database save failed');
    } catch (error) {
      console.error('Database save error:', error);
      showToast('Could not save changes to database.');
    }
  }

  async function deleteCustomer(id) {
    if (!confirm('Are you sure you want to delete this customer? This action cannot be undone.')) {
      return;
    }
    
    try {
      customers = customers.filter(c => c.id !== id);
      await saveToDatabase();
      renderCustomers();
      showToast('Customer deleted successfully.');
    } catch (error) {
      console.error('Error deleting customer:', error);
      showToast('Failed to delete customer.');
    }
  }

  function renderCustomers() {
    const list = document.getElementById('customers-list');
    if (!list) return;
    
    const searchQuery = (document.getElementById('customer-search')?.value || '').toLowerCase();
    
    // Filter customers based on search
    const filteredCustomers = customers.filter(c => 
      c.name.toLowerCase().includes(searchQuery) || 
      (c.phone && c.phone.includes(searchQuery))
    );
    
    if (filteredCustomers.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-users"></i>
          <h3>No Customers Found</h3>
          <p>${searchQuery ? 'No customers match your search.' : 'Click "Add New Customer" to create a customer record.'}</p>
        </div>
      `;
      return;
    }
    
    list.innerHTML = '';
    
    filteredCustomers.forEach(customer => {
      const card = document.createElement('div');
      card.className = 'customer-card';
      card.innerHTML = `
        <div class="customer-info">
          <div class="customer-name">${escapeHtml(customer.name)}</div>
          <div class="customer-contact">
            <div class="contact-item">
              <i class="fa-solid fa-phone"></i>
              <a href="tel:${escapeHtml(customer.phone)}">${escapeHtml(customer.phone)}</a>
            </div>
            ${customer.email ? `
              <div class="contact-item">
                <i class="fa-solid fa-envelope"></i>
                <a href="mailto:${escapeHtml(customer.email)}">${escapeHtml(customer.email)}</a>
              </div>
            ` : ''}
          </div>
        </div>
        <div class="customer-actions">
          <button onclick="editCustomer('${escapeHtml(customer.id)}')" class="btn-sm btn-outline">Edit</button>
          <button onclick="deleteCustomer('${escapeHtml(customer.id)}')" class="btn-sm btn-danger">Delete</button>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function editCustomer(id) {
    const customer = customers.find(c => c.id === id);
    if (!customer) return;
    
    document.getElementById('customer-modal').classList.remove('hidden');
    document.getElementById('cust-name').value = customer.name;
    document.getElementById('cust-phone').value = customer.phone;
    document.getElementById('cust-email').value = customer.email || '';
    
    // Change form to update mode
    document.querySelector('.modal-title').textContent = 'Edit Customer';
    document.querySelector('form').onsubmit = function(event) {
      event.preventDefault();
      updateCustomer(id);
    };
  }

  async function updateCustomer(id) {
    const name = document.getElementById('cust-name').value;
    const phone = document.getElementById('cust-phone').value;
    const email = document.getElementById('cust-email').value;
    
    try {
      // Update in local array
      const index = customers.findIndex(c => c.id === id);
      if (index !== -1) {
        customers[index] = { id, name, phone, email: email || '' };
      }
      
      // Save to database
      await saveToDatabase();
      
      closeCustomerModal();
      renderCustomers();
      showToast('Customer updated successfully!');
      
      // Reset form
      document.querySelector('.modal-title').textContent = 'Add New Customer';
      document.querySelector('form').onsubmit = saveCustomer;
    } catch (error) {
      console.error('Error updating customer:', error);
      showToast('Failed to update customer.');
    }
  }

  function escapeHtml(text) {
    if (!text) return '';
    return text.toString()
      .replace(/&/g, "&amp;")
      .replace(/<|>/g, "&lt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showToast(message) {
    let toast = document.getElementById('toast-notification');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast-notification';
      toast.className = 'fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 z-50 flex items-center gap-2';
      toast.innerHTML = '<i class="fa-solid fa-circle-info text-indigo-400"></i><span id="toast-message"></span>';
      document.body.appendChild(toast);
    }
    document.getElementById('toast-message').innerText = message;
    toast.classList.remove('translate-y-20', 'opacity-0');
    setTimeout(() => {
      toast.classList.add('translate-y-20', 'opacity-0');
    }, 3000);
  }

  // Close modal on overlay click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.add('hidden');
      }
    });
  });

  // Load customers on page load
  window.addEventListener('load', loadCustomers);
</script>
</body>
</html>
