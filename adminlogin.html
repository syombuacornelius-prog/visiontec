<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Access - Visiontec</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --danger: #dc2626;
    --background: #f8fafc;
    --surface: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .login-card {
    background: var(--surface);
    border-radius: 1.5rem;
    padding: 2.5rem;
    max-width: 450px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }

  .login-logo {
    width: 5rem;
    height: 5rem;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
  }

  .login-logo-icon {
    font-size: 2.5rem;
    font-weight: 800;
    color: white;
  }

  .login-title {
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .login-title h2 {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text);
  }

  .login-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.875rem;
    margin-bottom: 2rem;
  }

  .admin-badge {
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1.5rem;
    display: block;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.75rem;
    font-size: 0.875rem;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.75rem;
    border: none;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
  }

  .error-message {
    background: #fee2e2;
    border: 2px solid #ef4444;
    border-radius: 0.75rem;
    padding: 1rem;
    margin-bottom: 1.5rem;
    display: none;
  }

  .error-message p {
    color: #dc2626;
    font-size: 0.875rem;
  }

  .security-notice {
    background: #fef3c7;
    border: 2px solid #fcd34d;
    border-radius: 0.75rem;
    padding: 1rem;
    margin-top: 1.5rem;
    text-align: center;
  }

  .security-notice p {
    font-size: 0.75rem;
    color: #92400e;
  }

  .warning-notice {
    background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    border: 2px solid #ef4444;
    border-radius: 0.75rem;
    padding: 1rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .warning-notice p {
    font-size: 0.75rem;
    color: #dc2626;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon">V</div>
  </div>

  <div class="login-title">
    <h2>Admin Access Only</h2>
  </div>

  <p class="login-subtitle">
    Restricted access for authorized administrators only
  </p>

  <div class="admin-badge">
    <i class="fa-solid fa-shield-halved"></i> ADMIN PRIVILEGES REQUIRED
  </div>

  <div class="warning-notice">
    <p>
      <i class="fa-solid fa-triangle-exclamation"></i> 
      WARNING: Unauthorized access attempts are logged and monitored.
    </p>
  </div>

  <div id="error-message" class="error-message">
    <p><i class="fa-solid fa-circle-exclamation"></i> <span id="error-text"></span></p>
  </div>

  <form onsubmit="handleAdminLogin(event)">
    <div class="form-group">
      <label class="form-label">Admin Username</label>
      <input type="text" id="login-user" required placeholder="Enter admin username" class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Admin Password</label>
      <input type="password" id="login-pass" required placeholder="Enter admin password" class="form-input">
    </div>

    <button type="submit" class="btn-submit">
      <i class="fa-solid fa-lock"></i> Access Admin System
    </button>
  </form>

  <div class="security-notice">
    <p>
      <i class="fa-solid fa-lock"></i> 
      This system is for authorized administrators only. All access attempts are logged and monitored.
    </p>
  </div>
</div>

<script>
  // Check if already logged in as admin
  window.addEventListener('load', () => {
    const session = sessionStorage.getItem('user_session');
    if (session) {
      const user = JSON.parse(session);
      if (user.is_admin || user.role === 'admin') {
        // Already logged in as admin, redirect to dashboard
        window.location.href = '/dashboard.html';
        return;
      }
    }
  });

  async function handleAdminLogin(event) {
    event.preventDefault();
    
    const errorDiv = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    errorDiv.style.display = 'none';

    const username = document.getElementById('login-user').value;
    const password = document.getElementById('login-pass').value;

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      });

      const data = await response.json();

      if (data.success) {
        // Check if user has admin privileges
        if (!data.user.is_admin && data.user.role !== 'admin') {
          errorText.textContent = 'Access denied. Admin privileges required.';
          errorDiv.style.display = 'block';
          
          // Log the unauthorized access attempt
          await fetch('/api/logout', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username: username })
          });
          return;
        }

        // Store admin session
        sessionStorage.setItem('user_session', JSON.stringify({
          id: data.user.id,
          username: data.user.username,
          role: data.user.role,
          is_admin: true
        }));

        // Redirect to dashboard
        window.location.href = '/dashboard.html';
      } else {
        errorText.textContent = data.message || 'Invalid credentials';
        errorDiv.style.display = 'block';
      }
    } catch (error) {
      errorText.textContent = 'Connection error. Ensure the server is running.';
      errorDiv.style.display = 'block';
      console.error('Login error:', error);
    }
  }
</script>
</body>
</html>
