<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visiontec - Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --secondary: #f59e0b;
    --danger: #dc2626;
    --background: #f8fafc;
    --surface: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    color: var(--text);
    min-height: calc(100vh - 100px);
  }

  header {
    background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
    box-shadow: var(--shadow-lg);
  }

  .header-content {
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    font-size: 1.5rem;
    font-weight: 800;
    color: white;
    text-decoration: none;
  }

  .brand span {
    font-size: 0.75rem;
    font-weight: 400;
    color: #a5b4fc;
    display: block;
    margin-top: 0.25rem;
  }

  nav {
    background: rgba(79, 70, 229, 0.5);
    overflow-x: auto;
  }

  .nav-link {
    display: inline-block;
    padding: 0.75rem 1rem;
    color: #a5b4fc;
    font-size: 0.8125rem;
    text-decoration: none;
    white-space: nowrap;
  }

  .nav-link:hover {
    color: white;
    background: rgba(255, 255, 255, 0.1);
  }

  .nav-link.active {
    color: white;
    background: rgba(255, 255, 255, 0.2);
  }

  main {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .login-container {
    width: 100%;
    max-width: 450px;
  }

  .login-card {
    background: var(--surface);
    border-radius: 1.5rem;
    padding: 2.5rem;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }

  .login-logo {
    width: 5rem;
    height: 5rem;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
  }

  .login-logo-icon {
    font-size: 2.5rem;
    font-weight: 800;
    color: white;
  }

  .login-title h2 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .login-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.875rem;
    margin-bottom: 2rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.75rem;
    font-size: 0.875rem;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .password-input-wrapper {
    position: relative;
  }

  .password-toggle {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
  }

  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.75rem;
    border: none;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
  }

  .error-message {
    background: #fee2e2;
    border: 2px solid #ef4444;
    border-radius: 0.75rem;
    padding: 1rem;
    margin-bottom: 1.5rem;
    display: none;
  }

  .error-message p {
    color: #dc2626;
    font-size: 0.875rem;
  }

  .security-notice {
    background: #fef3c7;
    border: 2px solid #fcd34d;
    border-radius: 0.75rem;
    padding: 1rem;
    margin-top: 1.5rem;
    text-align: center;
  }

  .security-notice p {
    font-size: 0.75rem;
    color: #92400e;
  }
</style>
</head>
<body>
<header>
  <div class="header-content">
    <a href="home.html" class="brand">
      VISIONTEC
      <span>Computer Shop System</span>
    </a>
  </div>
  <nav>
    <a class="nav-link" href="home.html">Home</a>
    <a class="nav-link active" href="login.html">Login</a>
  </nav>
</header>

<main>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">V</div>
      </div>

      <div class="login-title">
        <h2>Login Required</h2>
      </div>

      <p class="login-subtitle">
        Enter your credentials to access the system
      </p>

      <div id="error-message" class="error-message">
        <p><i class="fa-solid fa-circle-exclamation"></i> <span id="error-text"></span></p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="login-user" required placeholder="Enter your username" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-pass" required placeholder="Enter your password" class="form-input">
            <button type="button" onclick="togglePasswordVisibility('login-pass', 'pass-toggle-icon')" class="password-toggle">
              <i id="pass-toggle-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          Sign In
        </button>
      </form>

      <div class="security-notice">
        <p>
          <i class="fa-solid fa-lock"></i> 
          Authorized personnel only. All login attempts are monitored and logged.
        </p>
      </div>
    </div>
  </div>
</main>

<script>
  // Check if already logged in
  window.addEventListener('load', () => {
    const session = sessionStorage.getItem('user_session');
    if (session) {
      window.location.href = 'dashboard.html';
      return;
    }
  });

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  async function handleLogin(event) {
    event.preventDefault();
    
    const errorDiv = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    errorDiv.style.display = 'none';

    const username = document.getElementById('login-user').value;
    const password = document.getElementById('login-pass').value;

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      });

      const data = await response.json();

      if (data.success) {
        // Determine user role
        const isAdmin = data.user.is_admin || data.user.role === 'admin';
        
        // Store session with role information
        sessionStorage.setItem('user_session', JSON.stringify({
          id: data.user.id,
          username: data.user.username,
          role: data.user.role,
          is_admin: isAdmin
        }));
        
        // All users go to dashboard, but access will be restricted based on role
        window.location.href = 'dashboard.html';
      } else {
        errorText.textContent = data.message || 'Invalid username or password';
        errorDiv.style.display = 'block';
      }
    } catch (error) {
      errorText.textContent = 'Connection error. Please ensure the server is running.'
      errorDiv.style.display = 'block';
      console.error('Login error:', error);
    }
  }
</script>
</body>
</html>
